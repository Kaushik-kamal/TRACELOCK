[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracelock"
version = "0.1.0"
description = "Digital evidence discovery with cryptographic chain-of-custody"
readme = "README.md"
requires-python = ">=3.11,<3.13"

# Every runtime dependency, with the reason it is here:
#   httpx            - async + sync in one client, real timeouts, HTTP/2
#   pydantic         - Candidate validation + .model_dump() for raw JSON persistence
#   pydantic-settings- typed env vars that fail loudly at import, not mid-run
#   pillow           - verify the probe decodes locally BEFORE spending an API call
#   insightface      - buffalo_l pack: SCRFD detection + ArcFace recognition.
#                      1.0.1 ships a PURE-PYTHON WHEEL, so no C++ compiler is
#                      needed on Windows. Do not downgrade to 0.7.x, which is
#                      sdist-only and requires MSVC Build Tools.
#   onnxruntime      - CPU inference. GPU setup would cost more time than it saves
#                      at our volumes (~2.1s per image warm).
#   opencv-python    - image decode, Laplacian, colour conversion.
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pillow>=10.3",
    "insightface>=1.0.1",
    "onnxruntime>=1.17",
    "opencv-python>=4.9",
    "numpy>=1.26",
    # Phase 4 -- blockchain anchoring
    "web3>=6.15",
    "py-solc-x>=2.0",
    "jcs>=0.2",
    # UI -- one process serves both the API and the static frontend
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "eth-tester[py-evm]>=0.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    # Exercises the PUBLIC chain code path against a fake adapter. No network,
    # no funds, no testnet. Never cite these as live-chain verification.
    "mocked_chain: mocked public-chain integration (no real blockchain)",
    # Reserved for a run against a funded testnet key. Nothing carries this
    # marker yet, because no live transaction has been performed.
    "live_chain: requires a funded public testnet account (not run in CI)",
]
